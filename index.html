function save(){try{localStorage.setItem('gdsb_demo_v1',JSON.stringify(db))}catch{toast('Storage is full. Use a smaller image.')}}

function toast(s){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
function wa(msg){window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(msg),'_blank','noopener')}
function nav(to){page=to;filter='All';render();window.scrollTo({top:0,behavior:'instant'})}
function isSale(p){return Number(p.salePrice)>0&&Number(p.salePrice)<Number(p.price)}
function actualPrice(p){return isSale(p)?Number(p.salePrice):Number(p.price)}
function discount(p){return isSale(p)?Math.round((1-p.salePrice/p.price)*100):0}
function cartQty(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function cartLines(){return Object.entries(cart).map(([id,qty])=>({p:db.products.find(p=>p.id===id),qty})).filter(x=>x.p&&x.qty>0)}
function subtotal(){return cartLines().reduce((a,{p,qty})=>a+actualPrice(p)*qty,0)}
function couponObj(){return db.coupons.find(c=>c.active&&c.code.toUpperCase()===couponApplied.toUpperCase())}
function discountTotal(){let c=couponObj();return !c?0:Math.min(subtotal(),c.type==='percent'?subtotal()*c.value/100:c.value)}
function datesActive(b){let now=new Date();return b.active&&(!b.start||new Date(b.start)<=now)&&(!b.end||new Date(b.end)>=now)}

label>Upload payment receipt *</label><input id="receipt-input" type="file" accept="image/png,image/jpeg,image/webp" required onchange="loadReceipt(event)"><small class="small-note">JPG, PNG or WebP, up to 1 MB for this demo.</small></div><label style="display:flex;gap:10px;align-items:start;font-size:12px;margin:16px 0"><input type="checkbox" required style="margin-top:3px"><span>I understand delivery fees will be discussed on WhatsApp, usually with delivery in 2–3 days depending on location. I have transferred to the verified vendor bank account.</span></label><button class="btn btn-primary" style="width:100%" type="submit">Submit order for verification ${icon('arrow')}</button></form><div class="card" style="align-self:start"><h2 class="admin-panel-title">Your order</h2>${cartItems()}<div class="form-field" style="margin-top:18px"><label>Coupon code (optional)</label><div style="display:flex;gap:8px"><input id="coupon-in" placeholder="Enter code" value="${esc(couponApplied)}" style="min-width:0"><button class="btn btn-secondary" onclick="applyCoupon()">Apply</button></div><small class="small-note" id="coupon-feedback">${couponApplied&&couponObj()?'Coupon applied!':''}</small></div><div class="order-total"><span>Products</span><span>${fmt(subtotal())}</span></div>${discountTotal()?`<div class="order-total" style="color:#3e7853"><span>Coupon discount</span><span>−${fmt(discountTotal())}</span></div>`:''}<div class="order-total" style="border-top:1px solid var(--line);font-size:19px"><span>Total to transfer</span><span>${fmt(subtotal()-discountTotal())}</span></div><div class="notice">Delivery fee: <strong>To be discussed via WhatsApp</strong>. This is not part of the transfer amount shown above.</div></div></div></main>`}
function applyCoupon(){let val=document.getElementById('coupon-in')?.value.trim().toUpperCase()||'';couponApplied=val;const found=couponObj();render();toast(found?'Coupon applied successfully':'Invalid or inactive coupon')}
function loadReceipt(event){const f=event.target.files?.[0];receiptData='';if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>1024*1024){toast('Please select a JPG, PNG or WebP receipt under 1 MB');event.target.value='';return}const reader=new FileReader();reader.onload=()=>{receiptData=reader.result;toast('Receipt attached')};reader.readAsDataURL(f)}
function submitOrder(e){e.preventDefault();if(!receiptData){toast('Please attach your payment receipt');return}if(db.bank.number==='—'){toast('Demo mode: vendor bank details are not configured yet. No real payments should be made.');return}let d=Object.fromEntries(new FormData(e.target).entries()),id='GD'+Date.now().toString().slice(-9),items=cartLines().map(({p,qty})=>({id:p.id,name:p.name,qty,unit:actualPrice(p)}));const o={id,customer:{name:d.name,phone:d.phone,state:d.state,city:d.city,address:d.address,note:d.note},items,subtotal:subtotal(),discount:discountTotal(),total:subtotal()-discountTotal(),coupon:couponObj()?.code||'',receipt:receiptData,status:'Pending verification',createdAt:new Date().toISOString()};db.orders.unshift(o);save();cart={};cartSave();receiptData='';couponApplied='';page='success';window.lastOrder=id;render();window.scrollTo(0,0)}

function orderMsg(o,type){let c=o.customer;if(type==='confirmed')return `Hello ${c.name}, this is GD Spark & Bloom. We have verified your payment of ${fmt(o.total)} for order ${o.id}. Thank you! We will discuss your delivery fee and arrangements with you here.`;if(type==='rejected')return `Hello ${c.name}, this is GD Spark & Bloom. We could not verify the payment receipt for order ${o.id} (${fmt(o.total)}). Please reply with your transfer details so we can review it. Do not make a second payment until we advise you.`;if(type==='delivery')return `Hello ${c.name}, your GD Spark & Bloom order ${o.id} has been sent for delivery. We'll share your delivery details here. Thank you for shopping with us!`;if(type==='delivered')return `Hello ${c.name}, our records show your GD Spark & Bloom order ${o.id} as delivered. Thank you for choosing us!`;return `Hello ${c.name}, this is GD Spark & Bloom about your order ${o.id}.`}
function setOrderStatus(id,status,withWhatsapp){let o=db.orders.find(o=>o.id===id);if(!o)return;o.status=status;save();render();toast('Order marked: '+status);if(withWhatsapp){let typ=status==='Payment confirmed'?'confirmed':status==='Payment not confirmed'?'rejected':status==='Out for delivery'?'delivery':status==='Delivered'?'delivered':'generic';wa(orderMsg(o,typ))}}
function ordersAdmin(){return `<div class="table-tools"><button class="chip active">All orders (${db.orders.length})</button><span class="small-note" style="align-self:center">Open each receipt to review the transfer before confirming.</span></div>${db.orders.length?db.orders.map(o=>`<article class="order-card"><div class="order-card-head"><div><b style="font-size:15px">${esc(o.id)} · ${esc(o.customer.name)}</b><p>${new Date(o.createdAt).toLocaleString('en-NG')} · ${esc(o.customer.phone)} · ${esc(o.customer.city)}, ${esc(o.customer.state)}</p><p><b>${fmt(o.total)}</b> · ${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join(', ')}</p><p>Address: ${esc(o.customer.address)}${o.customer.note?' · Note: '+esc(o.customer.note):''}</p></div><span class="status ${o.status==='Delivered'?'ok':o.status==='Payment not confirmed'?'bad':''}">${esc(o.status)}</span></div><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:15px"><a href="${o.receipt}" target="_blank" download="receipt-${esc(o.id)}.png" title="View payment receipt"><img class="receipt" src="${o.receipt}" alt="Uploaded receipt for ${esc(o.id)}"></a><span class="small-note">Tap receipt to open/download. Verify against bank records.</span></div><div class="order-actions"><button class="mini-btn" onclick="setOrderStatus('${o.id}','Payment confirmed',true)">Confirm & message</button><button class="mini-btn danger" onclick="setOrderStatus('${o.id}','Payment not confirmed',true)">Not confirmed & message</button><button class="mini-btn" onclick="setOrderStatus('${o.id}','Preparing order',false)">Preparing</button><button class="mini-btn" onclick="setOrderStatus('${o.id}','Out for delivery',true)">Send delivery message</button><button class="mini-btn" onclick="setOrderStatus('${o.id}','Delivered',true)">Mark delivered</button><button class="mini-btn" onclick="wa(orderMsg(db.orders.find(x=>x.id==='${o.id}'),'generic'))">Open WhatsApp chat</button></div></article>`).join(''):`<div class="shop-empty">No orders yet. Place a test order from the storefront after configuring demo bank details.</div>`}`}
function productsAdmin(){let p=editing?db.products.find(x=>x.id===editing):null;return `<div class="table-scroll" style="margin-bottom:23px"><table class="data-table"><thead><tr><th>Product</th><th>Price</th><th>Availability</th><th>Visibility</th><th>Actions</th></tr></thead><tbody>${db.products.map(p=>`<tr><td><div style="display:flex;align-items:center;gap:9px"><img src="${esc(p.image)}" width="39" height="39" style="border-radius:7px;object-fit:cover" alt=""><div><b>${esc(p.name)}</b><br><span class="muted">${esc(p.category)} ${p.bestseller?'· Best seller':''}</span></div></div></td><td>${fmt(actualPrice(p))}${isSale(p)?` <del>${fmt(p.price)}</del>`:''}</td><td><span class="status ${p.stock?'ok':'bad'}">${p.stock?'In stock':'Unavailable'}</span></td><td>${p.hidden?'Hidden':'Visible'}</td><td><button class="mini-btn" onclick="editing='${p.id}';render();document.getElementById('product-form').scrollIntoView({behavior:'smooth'})">Edit</button> <button class="mini-btn" onclick="toggleProd('${p.id}','hidden')">${p.hidden?'Show':'Hide'}</button> <button class="mini-btn" onclick="toggleProd('${p.id}','stock')">${p.stock?'Sold out':'Available'}</button> <button class="mini-btn danger" onclick="deleteProd('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div><div class="card admin-form-card" id="product-form"><h2 class="admin-panel-title">${p?'Edit product':'Add a new product'}</h2><form onsubmit="saveProduct(event)"><div class="form-grid"><div class="form-field"><label>Product name *</label><input name="name" required maxlength="100" value="${esc(p?.name||'')}"></div><div class="form-field"><label>Category *</label><input name="category" required maxlength="60" placeholder="Herbal wellness" value="${esc(p?.category||'')}"></div><div class="form-field"><label>Regular price (₦) *</label><input name="price" type="number" min="1" step="1" required value="${p?.price||''}"></div><div class="form-field"><label>Sale price (₦) · optional</label><input name="salePrice" type="number" min="0" step="1" value="${p?.salePrice||''}"></div></div><div class="form-field"><label>Product description</label><textarea name="description" maxlength="500">${esc(p?.description||'')}</textarea></div><div class="form-field"><label>Product image URL (or upload below)</label><input name="image" placeholder="https://..." value="${esc(p?.image?.startsWith('data:')?'':p?.image||'')}"></div><div class="form-field"><label>Upload image (optional, max 1 MB in demo)</label><input name="imageUpload" type="file" accept="image/png,image/jpeg,image/webp"></div><div style="display:flex;flex-wrap:wrap;gap:18px;margin:6px 0 22px;font-size:13px"><label><input type="checkbox" name="stock" ${!p||p.stock?'checked':''}> Available</label><label><input type="checkbox" name="bestseller" ${p?.bestseller?'checked':''}> Best seller</label><label><input type="checkbox" name="hidden" ${p?.hidden?'checked':''}> Hidden from shop</label></div><button class="btn btn-primary" type="submit">${p?'Save product changes':'Add product'} ${icon('arrow')}</button>${p?` <button class="btn btn-secondary" type="button" onclick="editing=null;render()">Cancel</button>`:''}<p class="small-note">Discount percentages are calculated automatically when a valid sale price is lower than the regular price.</p></form></div>`}
function toggleProd(id,key){let p=db.products.find(p=>p.id===id);if(p){p[key]=!p[key];save();render();toast('Product updated')}}
function deleteProd(id){if(!confirm('Delete this product? This cannot be undone in the demo.'))return;db.products=db.products.filter(x=>x.id!==id);delete cart[id];cartSave();save();editing=null;render();toast('Product deleted')}
function fileData(f){return new Promise((resolve,reject)=>{if(!f)return resolve('');if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>1024*1024)return reject(Error('Please upload an image under 1 MB'));let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read image'));r.readAsDataURL(f)})}
async function saveProduct(e){e.preventDefault();let d=new FormData(e.target),price=Number(d.get('price')),salePrice=Number(d.get('salePrice')||0);if(salePrice&&salePrice>=price){toast('Sale price must be less than the regular price');return}try{let upload=await fileData(d.get('imageUpload'));let old=editing?db.products.find(x=>x.id===editing):null;let v={id:editing||'p'+Date.now(),name:d.get('name').trim(),category:d.get('category').trim(),description:d.get('description').trim(),price,salePrice,stock:d.has('stock'),bestseller:d.has('bestseller'),hidden:d.has('hidden'),image:upload||d.get('image')||old?.image||'https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?auto=format&fit=crop&w=650&q=80'};if(editing)db.products=db.products.map(x=>x.id===editing?v:x);else db.products.unshift(v);editing=null;save();render();toast('Product saved')}catch(err){toast(err.message)}}
function couponsAdmin(){return `<div class="card admin-form-card"><h2 class="admin-panel-title">Create a discount code</h2><form onsubmit="saveCoupon(event)"><div class="form-grid"><div class="form-field"><label>Coupon code *</label><input name="code" required placeholder="e.g. BLOOM20" pattern="[A-Za-z0-9_-]+" maxlength="30"></div><div class="form-field"><label>Discount type</label><select name="type"><option value="percent">Percentage (%)</option><option value="fixed">Fixed amount (₦)</option></select></div><div class="form-field"><label>Discount value *</label><input name="value" type="number" min="1" step="1" required></div></div><button class="btn btn-primary" type="submit">Create coupon ${icon('plus')}</button></form></div><div class="table-scroll" style="margin-top:24px"><table class="data-table"><thead><tr><th>Code</th><th>Discount</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.coupons.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td>${c.type==='percent'?c.value+'%':fmt(c.value)}</td><td>${c.active?'Active':'Inactive'}</td><td><button class="mini-btn" onclick="toggleCoupon('${esc(c.code)}')">${c.active?'Deactivate':'Activate'}</button> <button class="mini-btn danger" onclick="deleteCoupon('${esc(c.code)}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function saveCoupon(e){e.preventDefault();let d=new FormData(e.target),code=d.get('code').toUpperCase().trim(),type=d.get('type'),value=Number(d.get('value'));if(db.coupons.some(c=>c.code===code))return toast('Coupon already exists');if(type==='percent'&&value>100)return toast('Percentage cannot exceed 100');db.coupons.push({code,type,value,active:true});save();render();toast('Coupon created')}
function toggleCoupon(code){let c=db.coupons.find(x=>x.code===code);if(c)c.active=!c.active;save();render()}
function deleteCoupon(code){if(!confirm('Delete this coupon?'))return;db.coupons=db.coupons.filter(c=>c.code!==code);save();render()}
function bannerAdmin(){let b=db.banner;return `<div class="card admin-form-card"><h2 class="admin-panel-title">Promotional banner & countdown</h2><p class="muted">When a banner is active and within the scheduled dates, the homepage will display the promotion and countdown automatically.</p><form onsubmit="saveBanner(event)"><div class="form-field"><label>Banner headline *</label><input name="title" value="${esc(b.title)}" required maxlength="100"></div><div class="form-field"><label>Banner description</label><textarea name="subtitle">${esc(b.subtitle)}</textarea></div><div class="form-field"><label>Banner image URL (or upload below)</label><input name="image" value="${esc(b.image.startsWith('data:')?'':b.image)}" placeholder="https://..."></div><div class="form-field"><label>Upload banner image (optional, max 1 MB)</label><input name="imageUpload" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="form-grid"><div class="form-field"><label>Start date and time</label><input type="datetime-local" name="start" value="${esc(b.start)}"></div><div class="form-field"><label>End date and time</label><input type="datetime-local" name="end" value="${esc(b.end)}"></div></div><label style="display:block;margin-bottom:20px"><input type="checkbox" name="active" ${b.active?'checked':''}> Enable promotional banner</label><button class="btn btn-primary" type="submit">Save banner & schedule ${icon('arrow')}</button></form>${b.image?`<img class="banner-preview" style="margin-top:23px" src="${esc(b.image)}" alt="Current banner">`:''}</div><div class="notice" style="max-width:760px;margin-top:20px">Product sale prices are set separately in <b>Products</b>. The product card calculates and shows the percentage off automatically; the scheduled banner does not change product prices by itself.</div>`}
async function saveBanner(e){e.preventDefault();let d=new FormData(e.target);try{let upload=await fileData(d.get('imageUpload')),start=d.get('start'),end=d.get('end');if(start&&end&&new Date(end)<=new Date(start))return toast('End date must be later than start date');db.banner={title:d.get('title').trim(),subtitle:d.get('subtitle').trim(),image:upload||d.get('image')||db.banner.image,start,end,active:d.has('active')};save();render();toast('Banner updated')}catch(err){toast(err.message)}}
function settingsAdmin(){return `<div class="card admin-form-card"><h2 class="admin-panel-title">Bank transfer details</h2><div class="notice" style="margin-bottom:20px">Use a verified business bank account. Customers will see these details at checkout. This demo does not verify ownership of the account.</div><form onsubmit="saveBank(event)"><div class="form-field"><label>Account name</label><input name="name" required value="${esc(db.bank.name)}"></div><div class="form-field"><label>Bank name</label><input name="bank" required value="${esc(db.bank.bank==='Bank details to be configured by the vendor'?'':db.bank.bank)}"></div><div class="form-field"><label>Account number</label><input name="number" required inputmode="numeric" pattern="[0-9]{10}" placeholder="10-digit Nigerian account number" value="${esc(db.bank.number==='—'?'':db.bank.number)}"></div><button type="submit" class="btn btn-primary">Save transfer details</button></form><hr style="border:0;border-top:1px solid var(--line);margin:30px 0"><h2 class="admin-panel-title">Demo data controls</h2><p class="small-note">Data is only on this device. Deleting it cannot be undone.</p><button class="btn btn-outline" onclick="if(confirm('Reset all demo products, orders, banners and coupons?')){localStorage.removeItem('gdsb_demo_v1');db=load();cart={};cartSave();editing=null;render();toast('Demo reset')}" >Reset demo data</button></div>`}
function saveBank(e){e.preventDefault();let d=new FormData(e.target);db.bank={name:d.get('name').trim(),bank:d.get('bank').trim(),number:d.get('number').trim()};save();render();toast('Bank details saved in browser demo')}
function updateTimer(){let el=document.getElementById('sale-timer');if(!el)return;let ms=new Date(db.banner.end)-new Date();if(ms<=0){el.innerHTML='<b>Offer ended</b>';return}let days=Math.floor(ms/86400000),hours=Math.floor(ms%86400000/3600000),minutes=Math.floor(ms%3600000/60000),seconds=Math.floor(ms%60000/1000);el.innerHTML=[[days,'DAYS'],[hours,'HOURS'],[minutes,'MINS'],[seconds,'SECS']].map(([n,l])=>`<b>${String(n).padStart(2,'0')}<small>${l}</small></b>`).join('')}
function render(){document.title=(page==='admin'?'Admin · ':'')+'GD Spark & Bloom';document.getElementById('app').innerHTML=page==='admin'?admin():header()+(page==='home'?home():page==='shop'?shop():page==='about'?about():page==='contact'?contact():page==='cart'?cartPage():page==='checkout'?checkout():page==='success'?successPage():home())+footer();updateTimer()}
setInterval(updateTimer,1000);render();
</script></body></html>
