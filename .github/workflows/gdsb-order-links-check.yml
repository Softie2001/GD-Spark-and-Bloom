name: GD order link regression checks
on:
  push:
    branches:
      - fix/gdsb-admin-order-whatsapp-clean-url-20261120
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check JavaScript
        run: npm run check
      - name: Run regression tests
        run: npm test
