name: GD admin layout regression
on:
  push:
    branches:
      - fix/gdsb-admin-products-compact-sales-layout-20261124
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Syntax
        run: npm run check
      - name: Regression tests
        run: npm test
