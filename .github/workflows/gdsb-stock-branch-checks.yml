name: GD inventory test branch checks
on:
  push:
    branches:
      - gdsb-stock-quantity-safe-20261106
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check JavaScript
        run: npm run check
      - name: Run existing and stock regression tests
        run: npm test
