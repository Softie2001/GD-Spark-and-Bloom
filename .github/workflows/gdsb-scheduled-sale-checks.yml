name: GD scheduled sale branch checks
on:
  push:
    branches:
      - feature/gdsb-scheduled-product-prices-20261118
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate JavaScript
        run: npm run check
      - name: Run regression tests
        run: npm test
