name: GD global sale checks
on:
  push:
    branches:
      - feature/gdsb-global-percent-sale-20261124
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Syntax
        run: npm run check
      - name: Tests
        run: npm test
