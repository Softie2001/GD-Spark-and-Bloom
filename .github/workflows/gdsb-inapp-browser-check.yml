name: GD embedded mobile browser resilience checks
on:
  push:
    branches:
      - fix/gdsb-inapp-blank-screen-20261124
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm run check
      - run: npm test
